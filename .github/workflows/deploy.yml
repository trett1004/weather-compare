name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Builds a self-contained bundle and publishes it as the rolling "production"
  # release. The server pulls it from there (see deploy/update.sh), so no job
  # ever runs on the server itself.
  release:
    name: Publish production build
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend env
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || (echo "VITE_GOOGLE_CLIENT_ID is missing" && exit 1)

      - name: Build
        run: npm run build

      - name: Assemble bundle
        run: |
          mkdir bundle
          cp -r dist server.js index.js package.json package-lock.json bundle/
          (cd bundle && npm ci --omit=dev)
          echo "$GITHUB_SHA" > bundle/REVISION
          tar -czf weather-compare.tar.gz -C bundle .
          sha256sum weather-compare.tar.gz > weather-compare.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete production --cleanup-tag --yes || true
          gh release create production \
            weather-compare.tar.gz weather-compare.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Production build" \
            --notes "Automated build of $GITHUB_SHA, picked up by the server via deploy/update.sh."
