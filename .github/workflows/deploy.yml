name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    name: Deploy to server
    needs: test
    if: github.event_name == 'push'
    runs-on: self-hosted
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend env
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || (echo "VITE_GOOGLE_CLIENT_ID is missing" && exit 1)

      - name: Build
        run: npm run build

      - name: Sync files to app directory
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            $GITHUB_WORKSPACE/ $HOME/repositories/weather-compare/

      - name: Install production dependencies
        run: |
          cd $HOME/repositories/weather-compare
          npm ci --omit=dev

      - name: Restart app
        run: pm2 restart weather-compare --update-env
